# SonarQube analysis config for the web (Next.js) module.
# Scanned with sonar-scanner-cli; host/token/branch passed on the CLI by the
# TeamCity "Sonar analysis" build step.
sonar.projectKey=tape-web
sonar.projectName=tape-web
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.test.ts,**/*.test.tsx
