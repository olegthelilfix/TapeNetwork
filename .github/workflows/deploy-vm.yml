name: Deploy (GHCR + SSH)

# Variant 2: no GCP project-admin needed. Build 3 images, push to GHCR, then
# deploy onto the VM over plain SSH (key auth). See infra/README.md.
#
# Manual only — never auto-deploys on push. Trigger from Actions → Run workflow
# and pick the branch in the "Use workflow from" dropdown; that branch is what
# gets built and deployed.
on:
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push images to GHCR

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push backend
        run: |
          docker build -t "$IMAGE_PREFIX/tape-backend:$TAG" -t "$IMAGE_PREFIX/tape-backend:latest" ./backend
          docker push "$IMAGE_PREFIX/tape-backend:$TAG"
          docker push "$IMAGE_PREFIX/tape-backend:latest"

      - name: Build & push web
        run: |
          # COPY inside web/Dockerfile cannot reach ../packages (outside the
          # build context), so stage the OpenAPI spec into the web/ context first.
          mkdir -p web/packages/api-types/generated
          cp packages/api-types/generated/user-openapi.json \
             web/packages/api-types/generated/user-openapi.json
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.PUBLIC_WEB_URL }}" \
            --build-arg NEXT_PUBLIC_STREAMER_URL="${{ vars.PUBLIC_STREAMER_URL }}" \
            -t "$IMAGE_PREFIX/tape-web:$TAG" -t "$IMAGE_PREFIX/tape-web:latest" ./web
          rm -rf web/packages
          docker push "$IMAGE_PREFIX/tape-web:$TAG"
          docker push "$IMAGE_PREFIX/tape-web:latest"

      - name: Build & push cms
        run: |
          docker build \
            --build-arg VITE_ADMIN_API_URL="${{ vars.PUBLIC_API_URL }}/api/admin" \
            --build-arg VITE_STREAMER_URL="${{ vars.PUBLIC_STREAMER_URL }}" \
            -t "$IMAGE_PREFIX/tape-cms:$TAG" -t "$IMAGE_PREFIX/tape-cms:latest" ./cms
          docker push "$IMAGE_PREFIX/tape-cms:$TAG"
          docker push "$IMAGE_PREFIX/tape-cms:latest"

      - name: Build & push streamer
        run: |
          docker build -t "$IMAGE_PREFIX/tape-streamer:$TAG" -t "$IMAGE_PREFIX/tape-streamer:latest" ./streamer
          docker push "$IMAGE_PREFIX/tape-streamer:$TAG"
          docker push "$IMAGE_PREFIX/tape-streamer:latest"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Render deploy .env
        run: |
          cat > deploy.env <<EOF
          BACKEND_IMAGE=$IMAGE_PREFIX/tape-backend:$TAG
          WEB_IMAGE=$IMAGE_PREFIX/tape-web:$TAG
          CMS_IMAGE=$IMAGE_PREFIX/tape-cms:$TAG
          STREAMER_IMAGE=$IMAGE_PREFIX/tape-streamer:$TAG
          PUBLIC_WEB_URL=${{ vars.PUBLIC_WEB_URL }}
          PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
          CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
          POSTGRES_DB=tape
          POSTGRES_USER=tape
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          FLYWAY_STRATEGY=${{ vars.FLYWAY_STRATEGY || 'clean' }}
          EOF

      - name: Copy compose + env to VM
        run: |
          scp -i ~/.ssh/id_deploy infra/deploy/docker-compose.prod.yml \
            "${{ vars.SSH_USER }}@${{ vars.VM_HOST }}:/opt/tape/docker-compose.yml"
          scp -i ~/.ssh/id_deploy deploy.env \
            "${{ vars.SSH_USER }}@${{ vars.VM_HOST }}:/opt/tape/.env"

      - name: Deploy on VM
        run: |
          ssh -i ~/.ssh/id_deploy "${{ vars.SSH_USER }}@${{ vars.VM_HOST }}" \
            "echo '${{ secrets.GHCR_READ_TOKEN }}' | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin && \
             chmod 600 /opt/tape/.env && \
             cd /opt/tape && \
             docker compose pull && \
             docker compose up -d --remove-orphans && \
             docker image prune -f && \
             docker builder prune -f"
