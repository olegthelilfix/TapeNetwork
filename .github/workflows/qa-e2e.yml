name: QA E2E

# Runs the Playwright and Robot Framework smoke suites against a deployed URL and
# uploads each report as a downloadable artifact (Actions run -> Artifacts).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against"
        required: false
        default: "http://34.13.255.70"
  push:
    paths:
      - "qa-compare/**"
      - ".github/workflows/qa-e2e.yml"

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'http://34.13.255.70' }}

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-compare/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: qa-compare/playwright/playwright-report/
          retention-days: 30

  robot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-compare/robot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: rfbrowser init
      - run: robot --outputdir results -v BASE_URL:"$BASE_URL" tests/e2e/smoke.robot
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: robot-report
          path: qa-compare/robot/results/
          retention-days: 30
