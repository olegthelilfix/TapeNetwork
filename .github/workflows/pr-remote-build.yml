name: PR build & test (on VM)

# On every PR, ship the branch source to the VM and build + test all three
# modules there (in throwaway Docker containers). This only checks that the
# branch builds — it does NOT deploy. The PR check goes red if anything fails.
on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remote-build:
    runs-on: ubuntu-latest
    env:
      SSH_USER: ${{ vars.SSH_USER }}
      VM_HOST: ${{ vars.VM_HOST }}
      DIR: /tmp/pr-build-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Package & copy source to VM
        run: |
          # Reclaim disk before building: prune Docker build cache, dangling
          # images and stopped containers (never touches running-stack images
          # or named volumes), and drop pr-build dirs left behind by runs that
          # were cancelled/killed before their own "Clean up VM" step ran.
          # The 29G root disk fills up otherwise -> yarn install ENOSPC.
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" bash <<'PRECLEAN'
          set -eux
          docker builder prune -f    >/dev/null 2>&1 || true
          docker container prune -f  >/dev/null 2>&1 || true
          docker image prune -f      >/dev/null 2>&1 || true
          find /tmp -maxdepth 1 -name 'pr-build-*' -mmin +120 \
            -exec docker run --rm -v '{}':/w busybox sh -c 'rm -rf /w/..?* /w/.[!.]* /w/*' \; \
            -exec rmdir '{}' \; 2>/dev/null || true
          PRECLEAN
          tar czf src.tgz --exclude=.git --exclude=node_modules --exclude=target --exclude=.next \
            backend web cms
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" "mkdir -p '$DIR'"
          scp -i ~/.ssh/id_deploy src.tgz "$SSH_USER@$VM_HOST:$DIR/src.tgz"

      - name: Build & test on VM
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" DIR="$DIR" bash <<'REMOTE'
          set -euxo pipefail
          cd "$DIR"
          tar xzf src.tgz
          mkdir -p /opt/tape/ci/gradle   # cache Gradle deps between runs

          # Shared Gradle cache mount can't take concurrent runs (journal-1.lock
          # contention). Serialize builds on this VM instead of racing them.
          exec 9>/opt/tape/ci/build.lock
          flock 9

          # Gradle's journal lock records the owner by PID, but every container
          # runs Gradle at the same low PID (fresh PID namespace). A build killed
          # before releasing the lock leaves journal-1.lock claiming "PID 38" —
          # the next build's Gradle is also PID 38, thinks the owner is alive, and
          # blocks until timeout. Under flock nothing else holds it, so drop the
          # stale journal (an access-time cache Gradle rebuilds; deps untouched).
          # The cache is root-owned (written by the build container), so the SSH
          # user can't rm it directly — do it from a throwaway root container.
          docker run --rm -v /opt/tape/ci/gradle:/root/.gradle alpine \
            rm -rf /root/.gradle/caches/journal-1

          echo '::group::backend — gradle build'
          docker run --rm -v "$PWD/backend:/app" -v /opt/tape/ci/gradle:/root/.gradle -w /app \
            azul/zulu-openjdk:21 sh -c './gradlew build --no-daemon'
          echo '::endgroup::'

          echo '::group::web — yarn install && build && test'
          # --network host + explicit DNS: next/font/google fetches IBM Plex
          # fonts from fonts.googleapis.com at build time, so the container
          # needs the same outbound reach as the host (default bridge net was
          # timing out -> NextFontError ETIMEDOUT).
          docker run --rm --network host --dns 8.8.8.8 --dns 1.1.1.1 \
            -v "$PWD/web:/app" -w /app \
            node:20-alpine sh -c 'yarn install --frozen-lockfile && yarn build && yarn test'
          echo '::endgroup::'

          echo '::group::cms — yarn install && build'
          docker run --rm --network host --dns 8.8.8.8 --dns 1.1.1.1 \
            -v "$PWD/cms:/app" -w /app \
            node:20-alpine sh -c 'yarn install --frozen-lockfile && yarn build'
          echo '::endgroup::'
          REMOTE
      - name: Clean up VM
        if: always()
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" \
            "docker run --rm -v '$DIR:/w' busybox sh -c 'rm -rf /w/..?* /w/.[!.]* /w/*' 2>/dev/null || true; rmdir '$DIR' 2>/dev/null || true"
