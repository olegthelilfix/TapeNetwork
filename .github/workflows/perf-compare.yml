name: Perf compare vs master

# Runs the perf suite for a feature branch on an isolated throwaway stack, pulls
# the latest master baseline (from perf-baseline.yml), diffs them, and posts a
# delta table as a PR comment. Fails the check if latency/error regressed beyond
# the threshold. Triggered by the 'perf' label (or a re-run while labelled) so it
# doesn't run on every push.
on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: perf-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # to post/update the comment
  actions: read          # to download the baseline artifact

jobs:
  compare:
    # Only when the PR carries the 'perf' label.
    if: contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    env:
      SSH_USER: ${{ vars.SSH_USER }}
      VM_HOST: ${{ vars.VM_HOST }}
      DIR: /tmp/perf-head-${{ github.run_id }}
      PROJECT: perfhead_${{ github.run_id }}
      BACKEND_PORT: '18082'
      POSTGRES_PORT: '15434'
      MAX_REGRESSION: '15'
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.event.pull_request.head.sha }} }

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run perf on branch (isolated stack) & record
        run: |
          tar czf src.tgz --exclude=.git --exclude=node_modules --exclude=target --exclude=.next \
            backend web cms streamer docker-compose.yml perf
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" "mkdir -p '$DIR'"
          scp -i ~/.ssh/id_deploy src.tgz "$SSH_USER@$VM_HOST:$DIR/src.tgz"
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" \
            DIR="$DIR" PROJECT="$PROJECT" BACKEND_PORT="$BACKEND_PORT" POSTGRES_PORT="$POSTGRES_PORT" \
            VUS=20 RAMP=30s DURATION=1m \
            REF="${{ github.event.pull_request.head.sha }}" LABEL="${{ github.head_ref }}" \
            bash < perf/ci-run-and-record.sh

      - name: Fetch branch record
        run: |
          mkdir -p head
          scp -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST:$DIR/perf/results/perf-record.json" head/ || \
            { echo "no branch record produced"; exit 1; }

      - name: Download latest master baseline
        id: baseline
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: perf-baseline.yml
          name: perf-baseline-master
          branch: master
          path: base
          if_no_artifact_found: warn

      - name: Compare & build report
        id: cmp
        run: |
          if [ ! -f base/perf-record.json ]; then
            echo "no_base=1" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ No master baseline found — run **Perf baseline (master)** first." > report.md
            cat report.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          node perf/compare.mjs compare \
            --base base/perf-record.json --head head/perf-record.json \
            --max-regression "$MAX_REGRESSION" --md report.md
          echo "cmp_rc=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: perf-compare
          path: report.md

      - name: Tear down & clean up
        if: always()
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" DIR="$DIR" PROJECT="$PROJECT" bash <<'REMOTE'
          set -uxo pipefail
          cd "$DIR" 2>/dev/null && docker compose -p "$PROJECT" down -v --remove-orphans || true
          docker run --rm -v "$DIR:/w" busybox sh -c 'rm -rf /w/..?* /w/.[!.]* /w/*' 2>/dev/null || true
          rmdir "$DIR" 2>/dev/null || true
          REMOTE

      - name: Fail if regressed
        if: steps.cmp.outputs.no_base != '1' && steps.cmp.outputs.cmp_rc != '0'
        run: |
          echo "Perf regressed beyond ${MAX_REGRESSION}% vs master — see the PR comment."
          exit 1
