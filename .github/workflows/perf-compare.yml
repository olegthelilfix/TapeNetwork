name: Perf compare (master vs branch)

# In ONE run: bring up master and the PR branch on separate isolated throwaway
# stacks, load-test both back-to-back on the same VM (identical conditions ->
# low noise), then publish BOTH reports and their comparison to the PR — as a
# sticky comment and as a single downloadable artifact.
#
# Triggered by the 'perf' label so it doesn't run on every push.
on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: perf-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'perf') || contains(github.event.pull_request.labels.*.name, 'perf-journey') }}
    runs-on: ubuntu-latest
    env:
      SSH_USER: ${{ vars.SSH_USER }}
      VM_HOST: ${{ vars.VM_HOST }}
      DIR: /tmp/perf-${{ github.run_id }}
      MAX_REGRESSION: '15'
      # two isolated stacks, distinct projects + ports, one run
      BASE_PROJECT: perfbase_${{ github.run_id }}
      HEAD_PROJECT: perfhead_${{ github.run_id }}
      BASE_BACKEND_PORT: '18081'
      BASE_POSTGRES_PORT: '15433'
      HEAD_BACKEND_PORT: '18082'
      HEAD_POSTGRES_PORT: '15434'
      BASE_WEB_PORT: '13001'
      HEAD_WEB_PORT: '13002'
      # 'perf-journey' label runs the full-service user journey (web pages);
      # plain 'perf' runs the API suite.
      SUITE: ${{ contains(github.event.pull_request.labels.*.name, 'perf-journey') && 'journey' || 'scenarios' }}
      VUS: '20'
      RAMP: '30s'
      DURATION: '1m'
      # Pool-pressure profile: a fixed-rate hammer on /search, meant to
      # make a Hikari pool-size change visible in the perf-compare
      # numbers. Always on for this workflow only (not perf.yml's manual
      # run). The rate below is a starting point, not a proven
      # saturation point. See perf/README.md's "Pool-pressure profile"
      # section for the actual measurements. See run_leg()'s tar step
      # below for why perf/ is sourced from head-src for both legs.
      PRESSURE: '1'
      PRESSURE_RATE: '200'
      PRESSURE_RAMP: '15s'
      PRESSURE_DURATION: '1m'
      PRESSURE_MAX_VUS: '300'
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # ---- check out BOTH trees (master + PR head) into separate dirs ----
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: base-src

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head-src

      # ---- 4 rounds in symmetric order base,head,head,base ----
      # Running each leg twice, symmetrically, cancels the position bias where
      # whichever leg runs second benefits from a warmed VM / warm docker cache
      # and looks spuriously faster. compare.mjs takes the per-metric median.
      - name: Run perf x4 (base,head,head,base)
        run: |
          run_leg() {
            local leg="$1" round="$2" project="$3" bport="$4" pgport="$5" wport="$6" ref="$7" lbl="$8" srcdir="$9"
            local rdir="$DIR/${leg}${round}"
            # perf/ always comes from head-src, for BOTH legs (base included):
            # the base leg has to run the branch's own scenarios.js (the one
            # with PRESSURE/pool_pressure handling), or it produces zero
            # lat_pool_pressure samples no matter what the Hikari config does.
            # backend/web/cms/streamer/docker-compose.yml still come from each
            # leg's own $srcdir, unchanged (base-src for master, head-src for
            # the branch).
            tar czf /tmp/src-${leg}${round}.tgz \
                --exclude=.git --exclude=node_modules --exclude=target --exclude=.next \
                -C "$srcdir" backend web cms streamer docker-compose.yml \
                -C "$PWD/head-src" perf
            ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" "mkdir -p '$rdir'"
            scp -i ~/.ssh/id_deploy /tmp/src-${leg}${round}.tgz "$SSH_USER@$VM_HOST:$rdir/src.tgz"
            ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" \
              DIR="$rdir" PROJECT="${project}_r${round}" \
              BACKEND_PORT="$bport" POSTGRES_PORT="$pgport" WEB_PORT="$wport" \
              SUITE="$SUITE" VUS="$VUS" RAMP="$RAMP" DURATION="$DURATION" \
              PRESSURE="$PRESSURE" PRESSURE_RATE="$PRESSURE_RATE" PRESSURE_RAMP="$PRESSURE_RAMP" \
              PRESSURE_DURATION="$PRESSURE_DURATION" PRESSURE_MAX_VUS="$PRESSURE_MAX_VUS" \
              REF="$ref" LABEL="$lbl" \
              bash < head-src/perf/ci-run-and-record.sh
            # Tear this round's stack down immediately so its ports are free for
            # the next round (rounds reuse the same host ports per leg).
            ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" \
              "cd '$rdir' 2>/dev/null && docker compose -p '${project}_r${round}' down -v --remove-orphans 2>/dev/null || true"
          }
          HEAD_REF="${{ github.event.pull_request.head.sha }}"
          HEAD_LBL="${{ github.head_ref }}"
          BASE_REF="$(cd base-src && git rev-parse HEAD)"
          # order: base, head, head, base
          run_leg base 1 "$BASE_PROJECT" "$BASE_BACKEND_PORT" "$BASE_POSTGRES_PORT" "$BASE_WEB_PORT" "$BASE_REF" master   base-src
          run_leg head 1 "$HEAD_PROJECT" "$HEAD_BACKEND_PORT" "$HEAD_POSTGRES_PORT" "$HEAD_WEB_PORT" "$HEAD_REF" "$HEAD_LBL" head-src
          run_leg head 2 "$HEAD_PROJECT" "$HEAD_BACKEND_PORT" "$HEAD_POSTGRES_PORT" "$HEAD_WEB_PORT" "$HEAD_REF" "$HEAD_LBL" head-src
          run_leg base 2 "$BASE_PROJECT" "$BASE_BACKEND_PORT" "$BASE_POSTGRES_PORT" "$BASE_WEB_PORT" "$BASE_REF" master   base-src

      # ---- collect all four records ----
      - name: Fetch reports from VM
        run: |
          mkdir -p report/master report/branch
          for r in 1 2; do
            scp -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST:$DIR/base${r}/perf/results/perf-record.json" report/master/record-${r}.json
            scp -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST:$DIR/head${r}/perf/results/perf-record.json" report/branch/record-${r}.json
          done
          # keep one full report set (round 1) for the HTML artifact
          scp -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST:$DIR/base1/perf/results/summary.html" report/master/summary.html 2>/dev/null || true
          scp -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST:$DIR/head1/perf/results/summary.html" report/branch/summary.html 2>/dev/null || true
          ls -R report

      - name: Compare & build report
        id: cmp
        run: |
          set +e
          node head-src/perf/compare.mjs compare \
            --base report/master/record-1.json --base report/master/record-2.json \
            --head report/branch/record-1.json --head report/branch/record-2.json \
            --max-regression "$MAX_REGRESSION" --md report/comparison.md
          echo "cmp_rc=$?" >> "$GITHUB_OUTPUT"
          set -e
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "🏃 Perf run [\`${{ github.run_id }}\`](${RUN_URL}) · suite \`${SUITE}\` · 4 rounds (median) · $(date -u '+%Y-%m-%d %H:%M UTC') · head \`${{ github.event.pull_request.head.sha }}\`"
            echo
            cat report/comparison.md
            echo
            echo "_Full HTML reports + stats.csv: **perf-report** artifact on [this run](${RUN_URL})._"
          } > report/pr-comment.md
          cat report/pr-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR (new comment per run — keeps history)
        if: always()
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo "${{ github.repository }}" --body-file report/pr-comment.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload both reports + comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: report/
          if-no-files-found: warn

      - name: Tear down all stacks & clean up
        if: always()
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$VM_HOST" \
            DIR="$DIR" BASE_PROJECT="$BASE_PROJECT" HEAD_PROJECT="$HEAD_PROJECT" bash <<'REMOTE'
          set -uxo pipefail
          for p in "${BASE_PROJECT}_r1" "${BASE_PROJECT}_r2" "${HEAD_PROJECT}_r1" "${HEAD_PROJECT}_r2"; do
            docker compose -p "$p" down -v --remove-orphans 2>/dev/null || true
          done
          docker run --rm -v "$DIR:/w" busybox sh -c 'rm -rf /w/..?* /w/.[!.]* /w/*' 2>/dev/null || true
          rmdir "$DIR" 2>/dev/null || true
          REMOTE

      - name: Fail if regressed
        if: steps.cmp.outputs.cmp_rc != '0'
        run: |
          echo "Perf regressed beyond ${MAX_REGRESSION}% vs master — see the PR comment."
          exit 1
