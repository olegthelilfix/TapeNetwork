name: Deploy (Artifact Registry + WIF)

# Full design — requires project-admin provisioning (WIF, dedicated SAs, IAP,
# Artifact Registry). Until infra/terraform is applied with those grants, this
# is manual-only. The active pipeline is deploy-vm.yml (GHCR + SSH).
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  IMAGE_PREFIX: ${{ vars.GCP_AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}
  TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_AR_HOST }}" --quiet

      - name: Build & push backend
        run: |
          docker build -t "$IMAGE_PREFIX/backend:$TAG" -t "$IMAGE_PREFIX/backend:latest" ./backend
          docker push "$IMAGE_PREFIX/backend:$TAG"
          docker push "$IMAGE_PREFIX/backend:latest"

      - name: Build & push web
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.PUBLIC_WEB_URL }}" \
            -t "$IMAGE_PREFIX/web:$TAG" -t "$IMAGE_PREFIX/web:latest" ./web
          docker push "$IMAGE_PREFIX/web:$TAG"
          docker push "$IMAGE_PREFIX/web:latest"

      - name: Build & push cms
        run: |
          docker build \
            --build-arg VITE_ADMIN_API_URL="${{ vars.PUBLIC_API_URL }}/api/admin" \
            -t "$IMAGE_PREFIX/cms:$TAG" -t "$IMAGE_PREFIX/cms:latest" ./cms
          docker push "$IMAGE_PREFIX/cms:$TAG"
          docker push "$IMAGE_PREFIX/cms:latest"

      - name: Build & push streamer
        run: |
          docker build -t "$IMAGE_PREFIX/streamer:$TAG" -t "$IMAGE_PREFIX/streamer:latest" ./streamer
          docker push "$IMAGE_PREFIX/streamer:$TAG"
          docker push "$IMAGE_PREFIX/streamer:latest"

      - name: Render deploy .env
        run: |
          cat > deploy.env <<EOF
          BACKEND_IMAGE=$IMAGE_PREFIX/backend:$TAG
          WEB_IMAGE=$IMAGE_PREFIX/web:$TAG
          CMS_IMAGE=$IMAGE_PREFIX/cms:$TAG
          STREAMER_IMAGE=$IMAGE_PREFIX/streamer:$TAG
          PUBLIC_WEB_URL=${{ vars.PUBLIC_WEB_URL }}
          PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
          CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
          POSTGRES_DB=tape
          POSTGRES_USER=tape
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF

      - name: Copy compose + env to VM
        run: |
          gcloud compute scp --tunnel-through-iap --zone "${{ vars.GCP_ZONE }}" \
            infra/deploy/docker-compose.prod.yml \
            "${{ vars.VM_NAME }}:/tmp/docker-compose.yml"
          gcloud compute scp --tunnel-through-iap --zone "${{ vars.GCP_ZONE }}" \
            deploy.env "${{ vars.VM_NAME }}:/tmp/deploy.env"

      - name: Deploy on VM
        run: |
          gcloud compute ssh --tunnel-through-iap --zone "${{ vars.GCP_ZONE }}" \
            "${{ vars.VM_NAME }}" --command '
              sudo mv /tmp/docker-compose.yml /opt/tape/docker-compose.yml &&
              sudo mv /tmp/deploy.env /opt/tape/.env &&
              sudo chmod 600 /opt/tape/.env &&
              cd /opt/tape &&
              sudo docker compose pull &&
              sudo docker compose up -d --remove-orphans &&
              sudo docker image prune -f
            '
