# TeamCity (server + one agent) for CI/CD experiments.
# Built-in HSQLDB (fine for testing, NOT for real use).
# Agent uses docker-out-of-docker: shares the host Docker daemon via the socket.
#
# Deploy on the remote VM:
#   docker compose -f docker-compose.yml up -d
# Then open http://<VM_IP>:8111 and finish the setup wizard.

services:
  teamcity-server:
    image: jetbrains/teamcity-server:2025.03
    container_name: teamcity-server
    # No host port: Caddy proxies https://teamcity.tapenetwork.de -> teamcity-server:8111
    # (to expose directly for debugging, uncomment)
    # ports:
    #   - "8111:8111"
    volumes:
      - ./data:/data/teamcity_server/datadir
      - ./logs:/opt/teamcity/logs
    networks:
      - default
      - tape-edge
    restart: unless-stopped

  teamcity-agent:
    image: jetbrains/teamcity-agent:2025.03
    container_name: teamcity-agent-1
    environment:
      SERVER_URL: http://teamcity-server:8111
      AGENT_NAME: agent-docker-1
      # DOCKER_IN_DOCKER not set -> agent talks to the host daemon via the mounted socket below.
    volumes:
      - ./agent-conf:/data/teamcity_agent/conf
      # docker-out-of-docker: agent builds images on the HOST daemon (shares prod's daemon).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - teamcity-server
    restart: unless-stopped

  # ---- SonarQube (code analysis) -------------------------------------------
  # Community edition + its own postgres (Sonar's bundled H2 refuses to persist
  # across restarts). Needs vm.max_map_count=262144 on the HOST for its embedded
  # Elasticsearch — the deploy workflow sets that sysctl before `up`.
  sonar-db:
    image: postgres:16
    container_name: sonar-db
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - ./sonar-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - sonar-db
    # No host port: Caddy proxies https://sonar.tapenetwork.de -> sonarqube:9000
    # (to expose directly for debugging, uncomment)
    # ports:
    #   - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Keep the JVMs modest — this box also runs the prod stack + TeamCity.
      SONAR_WEB_JAVAOPTS: -Xmx512m
      SONAR_CE_JAVAOPTS: -Xmx512m
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Xmx512m -Xms512m
    volumes:
      - ./sonar-data:/opt/sonarqube/data
      - ./sonar-extensions:/opt/sonarqube/extensions
      - ./sonar-logs:/opt/sonarqube/logs
    networks:
      - default
      - tape-edge
    restart: unless-stopped

networks:
  # Shared with the prod compose (infra/deploy/docker-compose.prod.yml) so the
  # single Caddy running there can reach teamcity-server + sonarqube by name.
  # Create it once on the VM before `up`:
  #   docker network create tape-edge
  tape-edge:
    external: true
