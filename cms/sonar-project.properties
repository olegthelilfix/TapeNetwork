# SonarQube analysis config for the cms (Refine/Vite) module.
# Scanned with sonar-scanner-cli; host/token/branch passed on the CLI by the
# TeamCity "Sonar analysis" build step.
sonar.projectKey=tape-cms
sonar.projectName=tape-cms
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx
