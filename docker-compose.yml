services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tape}
      POSTGRES_USER: ${POSTGRES_USER:-tape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tape}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tape} -d ${POSTGRES_DB:-tape}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tape}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tape}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tape}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32bytes-min}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SEARCH_INDEX_DIR: ${SEARCH_INDEX_DIR:-/var/lib/tape/search}
      MEDIA_DIR: ${MEDIA_DIR:-/var/lib/tape/media}
      STREAMER_INTERNAL_URL: ${STREAMER_INTERNAL_URL:-http://streamer:8082}
      # Public-read cache (embedded Hazelcast). Single member by default — no extra infra.
      # PUBLIC_CACHE_TTL_SECONDS: per-map TTL safety net (0 = evict only on admin writes).
      # To run several backend instances as ONE cache cluster (cluster-wide eviction),
      # set HAZELCAST_MEMBERS on each to the peer list, e.g. "backend-a:5701,backend-b:5701";
      # TCP/IP discovery turns on only when that list is non-empty (multicast is always off).
      PUBLIC_CACHE_TTL_SECONDS: ${PUBLIC_CACHE_TTL_SECONDS:-600}
      # HAZELCAST_CLUSTER_NAME: ${HAZELCAST_CLUSTER_NAME:-tape-public-cache}
      # HAZELCAST_PORT: ${HAZELCAST_PORT:-5701}
      # HAZELCAST_MEMBERS: ${HAZELCAST_MEMBERS:-}
      # Dev resilience: self-heal Flyway across branch switches / rollbacks so the
      # backend boots instead of failing validation. Do NOT enable these in production.
      #   local dev default = repair (heals checksum drift, keeps data).
      #   ephemeral test stack: set FLYWAY_STRATEGY=clean in the deploy env to rebuild
      #   the DB from scratch on every start (self-enables clean; no other flag needed).
      FLYWAY_STRATEGY: ${FLYWAY_STRATEGY:-repair}
      FLYWAY_IGNORE_MIGRATION_PATTERNS: ${FLYWAY_IGNORE_MIGRATION_PATTERNS:-*:missing,*:future}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - searchdata:/var/lib/tape/search
      - mediadata:/var/lib/tape/media

  web:
    # Pre-built by dev-up.sh with `podman build --secret ...` because classic
    # docker-compose (podman compose) can't forward the Nexus npmrc secret. The
    # image tag lets compose reuse that build; override with WEB_IMAGE if needed.
    image: ${WEB_IMAGE:-localhost/tapenetwork-web:latest}
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_STREAMER_URL: ${NEXT_PUBLIC_STREAMER_URL:-http://localhost:8082}
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:8080}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_STREAMER_URL: ${NEXT_PUBLIC_STREAMER_URL:-http://localhost:8082}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

  cms:
    build:
      context: ./cms
      args:
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-http://localhost:8080/api/admin}
        VITE_STREAMER_URL: ${NEXT_PUBLIC_STREAMER_URL:-http://localhost:8082}
    ports:
      - "${CMS_PORT:-5173}:80"
    depends_on:
      - backend

  streamer:
    build:
      context: ./streamer
    environment:
      VIDEOS_DIR: /data/videos
      HLS_CACHE_DIR: /data/hls-cache
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - videodata:/data/videos
      - hlscache:/data/hls-cache
    ports:
      - "${STREAMER_PORT:-8082}:8082"

volumes:
  pgdata:
  searchdata:
  mediadata:
  videodata:
  hlscache:
