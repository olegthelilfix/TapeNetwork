# Production stack for the VM. Unlike the root docker-compose.yml, this pulls
# prebuilt images from GHCR (no build:). Image refs and secrets come
# from the .env file the deploy pipeline writes next to this file on the VM.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/tape/data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SEARCH_INDEX_DIR: /var/lib/tape/search
      MEDIA_DIR: /var/lib/tape/media
      STREAMER_INTERNAL_URL: http://streamer:8082
      # Flyway strategy is set by the deploy workflow: 'migrate' (default, data-safe —
      # preserves the DB across deploys and restarts) or 'clean' (only on a deliberate
      # deploy with clean_db=true: drop + re-apply V1..V<n> + re-seed). The fallback here
      # is 'migrate' so a plain restart / reboot NEVER wipes data. See FlywayConfig / CLAUDE.md.
      FLYWAY_STRATEGY: ${FLYWAY_STRATEGY:-migrate}
    volumes:
      - /opt/tape/data/search:/var/lib/tape/search
      - /opt/tape/data/media:/var/lib/tape/media
    # No host port: reached only via Caddy at https://tapenetwork.de/api/*
    # (public /api/v1 + admin /api/admin) over the internal network.
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEB_URL}
    # No host port: Caddy proxies https://tapenetwork.de -> web:3000
    depends_on:
      - backend

  cms:
    image: ${CMS_IMAGE}
    restart: unless-stopped
    # No host port: Caddy proxies https://cms.tapenetwork.de -> cms:80
    depends_on:
      - backend

  streamer:
    image: ${STREAMER_IMAGE}
    restart: unless-stopped
    environment:
      VIDEOS_DIR: /data/videos
      HLS_CACHE_DIR: /data/hls-cache
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # e2-medium is CPU-constrained — ultrafast keeps transcoding tractable.
      X264_PRESET: ${X264_PRESET:-ultrafast}
    volumes:
      - ${VIDEOS_HOST_DIR:-/home/oaleksandrov/videos}:/data/videos
      - ${HLS_CACHE_HOST_DIR:-/home/oaleksandrov/hls-cache}:/data/hls-cache
    # No host port: Caddy proxies https://video.tapenetwork.de -> streamer:8082

  # ---- Edge reverse proxy: TLS termination + HTTPS for every service -------
  # Terminates :80/:443, gets Let's Encrypt certs automatically, and routes by
  # Host header. See infra/deploy/Caddyfile. TeamCity + SonarQube live in the
  # teamcity/ compose and are reachable here via the shared `tape-edge` network.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@tapenetwork.de}
    volumes:
      - /opt/tape/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/tape/caddy/data:/data # certs + ACME account (persist across restarts!)
      - /opt/tape/caddy/config:/config
    networks:
      - default
      - tape-edge
    depends_on:
      - web
      - backend
      - cms
      - streamer

networks:
  # Shared with the teamcity/ compose so a single Caddy can reach teamcity-server
  # and sonarqube by name. Created once on the VM:
  #   docker network create tape-edge
  tape-edge:
    external: true
